<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plutana_PKG</title>
<style>
  :root {
    --black: #000000;
    --white: #ffffff;
    --gray: #9a9a9a;
    --panel: #0b0b0f;
    --line: #222230;
    --purple: #a855f7;
    --purple-glow: rgba(168, 85, 247, 0.55);
    --blue: #1e3a8a;
    --blue-glow: rgba(30, 58, 138, 0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ---------- Title ---------- */
  .logo {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-shadow: 0 0 18px rgba(255,255,255,0.15);
  }
  .logo .plutana { color: var(--purple); text-shadow: 0 0 18px var(--purple-glow); }
  .logo .pkg { color: #3b5bdb; text-shadow: 0 0 18px var(--blue-glow); }

  /* ---------- Screens ---------- */
  .screen {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: opacity 0.6s ease;
  }
  .screen.active { display: flex; }
  .screen.fade-out { opacity: 0; pointer-events: none; }

  /* ---------- Loader ---------- */
  .loader-ring {
    width: 70px;
    height: 70px;
    border: 3px solid var(--line);
    border-top-color: var(--purple);
    border-right-color: var(--blue);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-top: 28px;
  }
  .loader-text {
    margin-top: 22px;
    color: var(--gray);
    letter-spacing: 4px;
    font-size: 0.8rem;
    text-transform: uppercase;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Login ---------- */
  .login-box {
    width: min(360px, 90vw);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 36px 30px;
    box-shadow: 0 0 40px rgba(168,85,247,0.08), 0 0 60px rgba(30,58,138,0.12);
    text-align: center;
  }
  .login-box .logo { font-size: 2.2rem; margin-bottom: 26px; }
  .field {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 14px;
    background: #050507;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--white);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field:focus {
    border-color: var(--purple);
    box-shadow: 0 0 0 3px rgba(168,85,247,0.2);
  }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--purple), var(--blue));
    color: var(--white);
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: transform 0.15s, filter 0.2s;
  }
  .btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
  .error { color: #ff6b6b; font-size: 0.85rem; min-height: 1.2em; margin-top: 6px; }

  /* ---------- Main app ---------- */
  .app { align-items: stretch; justify-content: flex-start; overflow: hidden; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    padding: 18px 28px;
    border-bottom: 1px solid var(--line);
    background: #000;
  }
  header .logo { font-size: 1.6rem; }
  .search {
    width: min(340px, 100%);
    padding: 10px 14px;
    background: #050507;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--white);
    outline: none;
  }
  .search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(30,58,138,0.35); }
  .logout {
    background: none;
    border: 1px solid var(--line);
    color: var(--gray);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .logout:hover { color: var(--white); border-color: var(--purple); }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px 40px;
  }
  .status { color: var(--gray); margin-bottom: 18px; font-size: 0.9rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.2s, transform 0.2s;
  }
  .card:hover { border-color: var(--purple); transform: translateY(-2px); }
  .card h3 {
    font-size: 1rem;
    line-height: 1.3;
    color: var(--white);
  }
  .card dl { font-size: 0.82rem; color: var(--gray); display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
  .card dt { color: #666; text-transform: capitalize; }
  .card dd { word-break: break-word; }
  .card a.dl {
    margin-top: auto;
    display: inline-block;
    text-align: center;
    padding: 9px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--purple), var(--blue));
    color: var(--white);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.85rem;
  }
  .empty { color: var(--gray); text-align: center; padding: 60px 0; }
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loading" class="screen active">
  <div class="logo"><span class="plutana">Plutana</span><span class="pkg">_PKG</span></div>
  <div class="loader-ring"></div>
  <div class="loader-text">Loading</div>
</div>

<!-- LOGIN SCREEN -->
<div id="login" class="screen">
  <div class="login-box">
    <div class="logo"><span class="plutana">Plutana</span><span class="pkg">_PKG</span></div>
    <form id="loginForm" autocomplete="off">
      <input class="field" id="username" type="text" placeholder="Username" required>
      <input class="field" id="password" type="password" placeholder="Password" required>
      <button class="btn" type="submit">LOG IN</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="screen app">
  <header>
    <div class="logo"><span class="plutana">Plutana</span><span class="pkg">_PKG</span></div>
    <input class="search" id="search" type="text" placeholder="Search games...">
    <button class="logout" id="logout">Log out</button>
  </header>
  <div class="content">
    <div class="status" id="status">Fetching games...</div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
  const DATA_URL = "https://raw.githubusercontent.com/huggingfacer04/ps4-games-database/main/ps4_games_with_downloads.json";

  const $ = (id) => document.getElementById(id);
  let allGames = [];

  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active", "fade-out"));
    $(id).classList.add("active");
  }

  // Loading screen -> login
  window.addEventListener("load", () => {
    setTimeout(() => {
      $("loading").classList.add("fade-out");
      setTimeout(() => show("login"), 600);
    }, 2200);
  });

  // Login (client-side only; any non-empty credentials are accepted)
  $("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const u = $("username").value.trim();
    const p = $("password").value;
    if (!u || !p) {
      $("loginError").textContent = "Enter a username and password.";
      return;
    }
    $("loginError").textContent = "";
    sessionStorage.setItem("plutana_user", u);
    show("app");
    loadGames();
  });

  $("logout").addEventListener("click", () => {
    sessionStorage.removeItem("plutana_user");
    $("loginForm").reset();
    show("login");
  });

  // Fetch games from the JSON source
  async function loadGames() {
    $("status").textContent = "Fetching games...";
    $("grid").innerHTML = "";
    try {
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const json = await res.json();
      allGames = Array.isArray(json) ? json : (json.games || Object.values(json));
      render(allGames);
    } catch (err) {
      $("status").textContent = "Could not load games: " + err.message;
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function render(list) {
    const grid = $("grid");
    grid.innerHTML = "";
    $("status").textContent = `${list.length} game${list.length === 1 ? "" : "s"}`;

    if (!list.length) {
      grid.innerHTML = `<div class="empty">No games found.</div>`;
      return;
    }

    const frag = document.createDocumentFragment();
    list.slice(0, 300).forEach((g) => {
      const card = document.createElement("div");
      card.className = "card";

      const name = g.title || g.name || g.game_name || g.Title || "Untitled";
      let rows = "";
      let link = "";

      Object.entries(g).forEach(([k, v]) => {
        if (v === null || v === undefined || v === "") return;
        if (["title", "name", "game_name", "Title"].includes(k)) return;
        if (typeof v === "string" && /^https?:\/\//.test(v)) {
          if (!link) link = v;
          return;
        }
        const val = typeof v === "object" ? JSON.stringify(v) : String(v);
        rows += `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${esc(val)}</dd>`;
      });

      card.innerHTML = `
        <h3>${esc(name)}</h3>
        ${rows ? `<dl>${rows}</dl>` : ""}
        ${link ? `<a class="dl" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Open Link</a>` : ""}
      `;
      frag.appendChild(card);
    });
    grid.appendChild(frag);
  }

  // Search filter
  $("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) return render(allGames);
    render(allGames.filter(g => JSON.stringify(g).toLowerCase().includes(q)));
  });
</script>
</body>
</html>
